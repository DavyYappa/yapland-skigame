services:
    mysql:
        image: mysql:8.4
        ports: [3306]
        environment:
            MYSQL_PASSWORD: dev
            MYSQL_USER: yapland_ski_app
            MYSQL_ROOT_PASSWORD: dev
            MYSQL_DATABASE: yapland_ski_app
        volumes:
            - yapland_ski_db:/var/lib/mysql
        labels:
            com.symfony.server.service-prefix: 'DATABASE'

    # Catches every mail locally: symfony open:local:webmail
    mailer:
        image: axllent/mailpit
        ports: [1025, 8025]
        environment:
            MP_SMTP_AUTH_ACCEPT_ANY: 1
            MP_SMTP_AUTH_ALLOW_INSECURE: 1
        labels:
            com.symfony.server.service-prefix: 'MAILER'

volumes:
    yapland_ski_db:
