services:
    mysql:
        image: mysql:8.4
        ports: [3306]
        environment:
            MYSQL_PASSWORD: dev
            MYSQL_USER: yapland_ski_app
            MYSQL_ROOT_PASSWORD: dev
            MYSQL_DATABASE: yapland_ski_app
        volumes:
            - yapland_ski_db:/var/lib/mysql
        labels:
            com.symfony.server.service-prefix: 'DATABASE'

volumes:
    yapland_ski_db:
